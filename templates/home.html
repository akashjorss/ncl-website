<section class="hero wrap">
  <div class="hero-inner">
    <div>
      <p class="eyebrow" data-i18n="hero.eyebrow">Neural Continuity Labs</p>
      <h1 data-i18n="hero.title">Neural physics<br />for the real world.</h1>
    </div>
    <div class="hero-copy">
      <p data-i18n="hero.lead">
        We develop neural methods to reconstruct, model, and understand physical
        systems, starting with industrial processes.
      </p>
      <a class="text-link" href="/contact.html"
        ><span data-i18n="hero.contact">Get in touch</span
        ><span class="arrow" aria-hidden="true">↗</span></a
      >
    </div>
  </div>
</section>
<div class="wrap">
  <div
    class="field-shell"
    role="img"
    aria-label="An illustrative, slowly evolving procedural field with six fixed sensor points. Not a physical simulation or measured data."
    data-i18n-attr="aria-label:field.alt"
  >
    <img
      class="fallback"
      src="/assets/field-still.svg"
      width="1280"
      height="604"
      alt=""
      aria-hidden="true"
      fetchpriority="high"
    />
    <canvas id="field" aria-hidden="true"></canvas>
  </div>
  <section class="lab-notes" aria-labelledby="notes-title">
    <div>
      <h2 id="notes-title" data-i18n="notes.title">Notes from the Lab</h2>
      <p class="section-intro" data-i18n="notes.intro">
        Questions, experiments, and things we are learning.
      </p>
    </div>
    {{latestNotes}}
  </section>
</div>
