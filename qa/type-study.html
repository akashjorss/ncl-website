<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>NCL | Type scale comparison</title><style>
@font-face{font-family:DM;src:url('/assets/fonts/dm-sans.ttf')}*{box-sizing:border-box}body{margin:0;background:#dde4de;color:#193c34;font:14px/1.5 DM,Arial,sans-serif}header{padding:22px 32px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #b8c8bd}h1{font-size:20px;font-weight:500;margin:0}p{margin:4px 0 0;font-size:12px}fieldset{border:0;display:flex;gap:6px;padding:0;margin:0}legend{font-size:10px;margin-bottom:5px}button{border:1px solid #9fb4a5;background:transparent;color:inherit;padding:8px 13px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#193c34;color:#edf2ed}button:focus-visible{outline:2px solid #286a52;outline-offset:3px}#sizes{padding:12px 32px;margin:0;font-size:12px}iframe{display:block;width:100%;height:1250px;border:0;background:#edf2ed}main{padding:0 32px 40px}.phone{max-width:390px;margin:auto}@media(max-width:650px){header{padding:18px;gap:16px}main{padding:0 12px 24px}#sizes{padding:12px 18px}button{font-size:12px;padding:8px 10px}iframe{height:1100px}}
</style></head><body><header><div><h1>Finding the right type scale</h1><p>Three studies in Mineral. The field is held still for comparison.</p></div><fieldset><legend>Scale</legend><button data-scale="quiet">Restrained</button><button data-scale="balanced">Editorial</button><button data-scale="open">Generous</button></fieldset><fieldset><legend>Viewport</legend><button data-view="desktop">Desktop</button><button data-view="phone">Phone</button></fieldset><fieldset><legend>Language</legend><button data-language="en">EN</button><button data-language="fr">FR</button><button data-language="de">DE</button></fieldset></header><p id="sizes" aria-live="polite"></p><main><iframe id="preview" title="NCL typography preview" src="/?lang=en&amp;static"></iframe></main><script>
const scales={quiet:{hero:56,intro:17,nav:15,title:34,summary:17,phone:46},balanced:{hero:64,intro:18,nav:16,title:38,summary:18,phone:49},open:{hero:72,intro:20,nav:17,title:42,summary:19,phone:52}};
let scale='balanced',view='desktop',language='en';const frame=document.querySelector('iframe');
function apply(){const p=scales[scale];frame.classList.toggle('phone',view==='phone');document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scale?b.dataset.scale===scale:b.dataset.view?b.dataset.view===view:b.dataset.language===language)));document.querySelector('#sizes').textContent=`Headline ${p.hero}px / introduction ${p.intro}px / note title ${p.title}px / summary ${p.summary}px. Headings adapt on phones.`;if(!frame.contentDocument?.querySelector('.hero'))return;let style=frame.contentDocument.getElementById('type-study');if(!style){style=frame.contentDocument.createElement('style');style.id='type-study';frame.contentDocument.head.append(style)}style.textContent=`.hero h1{font-size:${p.hero}px;line-height:1.02}.hero-copy p{font-size:${p.intro}px;max-width:390px}.nav{font-size:${p.nav}px}.lab-notes .note-row h3{font-size:${p.title}px;line-height:1.12}.note-row p{font-size:${p.summary}px;max-width:640px}@media(max-width:760px){.hero h1{font-size:${p.phone}px}.lab-notes .note-row h3{font-size:${p.title-4}px}.nav{font-size:clamp(14px,4.1vw,16px)}}`}
frame.addEventListener('load',apply);document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.scale)scale=b.dataset.scale;if(b.dataset.view)view=b.dataset.view;if(b.dataset.language){language=b.dataset.language;frame.src='/?lang='+language+'&static'}apply()}));apply();
</script></body></html>
