<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural Continuity Labs</title>
  <meta name="description" content="Neural Continuity Labs. Physics and AI, applied to industry.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1120" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://neuralcontinuitylabs.com/">
  <link rel="alternate" hreflang="en" href="https://neuralcontinuitylabs.com/?lang=en">
  <link rel="alternate" hreflang="de" href="https://neuralcontinuitylabs.com/?lang=de">
  <link rel="alternate" hreflang="fr" href="https://neuralcontinuitylabs.com/?lang=fr">
  <link rel="alternate" hreflang="x-default" href="https://neuralcontinuitylabs.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Neural Continuity Labs">
  <meta property="og:title" content="Neural Continuity Labs">
  <meta property="og:description" content="Physics and AI, applied to industry.">
  <meta property="og:url" content="https://neuralcontinuitylabs.com/">
  <meta property="og:image" content="https://neuralcontinuitylabs.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body data-page="index">
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>

  <header class="top">
    <div class="wrap">
      <a class="brand" href="./">NCL</a>
      <nav class="nav" aria-label="Site">
        <a href="#contact" data-i18n="nav.contact">Contact</a>
        <div class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label:lang.label">
          <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
          <button type="button" data-lang="de" aria-pressed="false" lang="de">DE</button>
          <button type="button" data-lang="fr" aria-pressed="false" lang="fr">FR</button>
        </div>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="wrap">
        <h1>Neural Continuity Labs</h1>
        <p class="tagline" data-i18n="hero.tagline">Physics and AI, applied to industry.</p>
      </div>
    </section>

    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div class="wrap">
        <h2 id="contact-title" data-i18n="contact.title">Contact</h2>
        <p class="contact-lead"><a href="mailto:contact@neuralcontinuitylabs.com">contact@neuralcontinuitylabs.com</a></p>
        <form id="contact-form" novalidate>
          <label>
            <span data-i18n="form.name">Name</span>
            <input name="name" type="text" required autocomplete="name">
          </label>
          <label>
            <span data-i18n="form.email">Email</span>
            <input name="email" type="email" required autocomplete="email">
          </label>
          <label>
            <span data-i18n="form.message">Message</span>
            <textarea name="message" rows="4" required></textarea>
          </label>
          <div class="honey" aria-hidden="true">
            <label>Leave this field empty <input name="_honey" type="text" tabindex="-1" autocomplete="off"></label>
          </div>
          <div class="form-foot">
            <button class="btn" type="submit" data-i18n="form.send">Send</button>
            <p class="small"><span data-i18n="form.privacy">Your details are used only to reply to you.</span> <a href="legal.html#privacy" data-i18n="form.privacyLink">Privacy notice</a>.</p>
          </div>
          <p class="status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>© 2026 Neural Continuity Labs</span>
      <a href="legal.html" data-i18n="footer.legal">Legal notice</a>
      <a href="legal.html#privacy" data-i18n="footer.privacy">Privacy</a>
    </div>
  </footer>
</body>
</html>
